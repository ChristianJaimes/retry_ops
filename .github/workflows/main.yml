name: Unit tests and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.6', '3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    container: python:${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Test installed package outside checkout
        run: |
          mkdir -p /tmp/retry-ops-tests
          cp -R tests /tmp/retry-ops-tests/
          cd /tmp/retry-ops-tests
          python -m pytest -q
